
spring.application.name=ai-build-investigation-agent

server.port=8410

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:8b-q4_K_M

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=120s

management.endpoints.web.exposure.include=health,info


# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/nexpay_agent?options=-c%20TimeZone%3DUTC
spring.datasource.username=nexpay_user
spring.datasource.password=${NEXPAY_AGENT_DB_PASSWORD:AgentDb_2026_Local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize the database schema from schema.sql
spring.sql.init.mode=always
