
spring.application.name=ai-cicd-analyzer
server.port=8300

# API key authentication
nexpay.security.api-key=${NEXPAY_API_KEY:}

# Ollama connection
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:8b-q4_K_M

# HTTP client timeout settings
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=120s
spring.http.reactiveclient.connect-timeout=5s
spring.http.reactiveclient.read-timeout=120s

# AI retry configuration
# Temporary testing setting: disable additional AI retries
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=2s
spring.ai.retry.on-client-errors=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.ollama.register-health-indicator=true
resilience4j.circuitbreaker.instances.ollama.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ollama.sliding-window-size=2
resilience4j.circuitbreaker.instances.ollama.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.ollama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ollama.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ollama.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ollama.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.ollama.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.ollama.slow-call-duration-threshold=10m
logging.level.io.github.resilience4j.circuitbreaker.internal.CircuitBreakerStateMachine=DEBUG

# Resilience4j logging
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.spring6.circuitbreaker=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
